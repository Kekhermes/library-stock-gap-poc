server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: library-stock-gap-backend
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5433}/${POSTGRES_DB:stockgap}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    schemas: runtime, evaluation, public
    default-schema: runtime
    baseline-on-migrate: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: stock-gap-backend
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

stockgap:
  worker-token: ${WORKER_TOKEN:worker-internal-secret-token}
  kafka-enabled: ${KAFKA_ENABLED:true}
  auto-seed: ${AUTO_SEED:true}
  seed-file-path: ${SEED_FILE_PATH:}
  topics:
    commands: stock-gap.agent.commands.v1
    events: stock-gap.agent.events.v1
    dead-letter: stock-gap.agent.dead-letter.v1

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      show-details: always
